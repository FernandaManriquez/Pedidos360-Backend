
spring.application.name=servicioPedidos
server.port=${SERVER_PORT:8082}


spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI}


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pedidos360}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}


spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true


spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}


spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true


app.rabbitmq.exchange=pedidos360.eventos
app.rabbitmq.pedido-creado-routing-key=pedido.creado

app.rabbitmq.notificaciones-queue=pedidos360.notificaciones
app.rabbitmq.tickets-queue=pedidos360.tickets


app.rabbitmq.dead-letter-exchange=pedidos360.dlx
app.rabbitmq.notificaciones-dlq=pedidos360.notificaciones.dlq
app.rabbitmq.tickets-dlq=pedidos360.tickets.dlq


app.rabbitmq.notificaciones-dead-routing-key=notificaciones.dead
app.rabbitmq.tickets-dead-routing-key=tickets.dead