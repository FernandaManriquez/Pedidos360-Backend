name: pedidos360-ea3-kafka

x-zookeeper-env: &zookeeper-env
  ZOO_SERVERS: >-
    server.1=zk1:2888:3888;2181
    server.2=zk2:2888:3888;2181
    server.3=zk3:2888:3888;2181

x-zookeeper: &zookeeper
  image: zookeeper:3.8.4

x-broker-env: &broker-env
  KAFKA_ZOOKEEPER_CONNECT: "zk1:2181,zk2:2181,zk3:2181"
  KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:9094"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,HOST:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_NUM_PARTITIONS: "3"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

x-broker: &broker
  image: confluentinc/cp-kafka:7.7.13
  depends_on:
    - zk1
    - zk2
    - zk3

services:
  zk1:
    <<: *zookeeper
    hostname: zk1
    environment:
      <<: *zookeeper-env
      ZOO_MY_ID: "1"
    volumes:
      - zk1-data:/data
      - zk1-log:/datalog

  zk2:
    <<: *zookeeper
    hostname: zk2
    environment:
      <<: *zookeeper-env
      ZOO_MY_ID: "2"
    volumes:
      - zk2-data:/data
      - zk2-log:/datalog

  zk3:
    <<: *zookeeper
    hostname: zk3
    environment:
      <<: *zookeeper-env
      ZOO_MY_ID: "3"
    volumes:
      - zk3-data:/data
      - zk3-log:/datalog

  broker1:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker1:9092,HOST://localhost:19092"
    ports:
      - "127.0.0.1:19092:9094"
    volumes:
      - broker1-data:/var/lib/kafka/data

  broker2:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker2:9092,HOST://localhost:29092"
    ports:
      - "127.0.0.1:29092:9094"
    volumes:
      - broker2-data:/var/lib/kafka/data

  broker3:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker3:9092,HOST://localhost:39092"
    ports:
      - "127.0.0.1:39092:9094"
    volumes:
      - broker3-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      - broker1
      - broker2
      - broker3
    ports:
      - "127.0.0.1:8091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360-ea3
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker1:9092,broker2:9092,broker3:9092"

volumes:
  zk1-data:
  zk1-log:
  zk2-data:
  zk2-log:
  zk3-data:
  zk3-log:
  broker1-data:
  broker2-data:
  broker3-data:
