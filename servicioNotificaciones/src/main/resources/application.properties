# Identificacion del servicio
spring.application.name=servicioNotificaciones
server.port=${SERVER_PORT:8083}

# Autenticacion JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI}

# Conexion con RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# Confirmacion manual de mensajes
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1

# Los mensajes rechazados sin reencolado siguen su ruta DLQ
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Exchange principal y clave del evento
app.rabbitmq.exchange=pedidos360.eventos
app.rabbitmq.pedido-creado-routing-key=pedido.creado

# Colas principales
app.rabbitmq.notificaciones-queue=pedidos360.notificaciones
app.rabbitmq.tickets-queue=pedidos360.tickets

# Exchange y colas de mensajes fallidos
app.rabbitmq.dead-letter-exchange=pedidos360.dlx
app.rabbitmq.notificaciones-dlq=pedidos360.notificaciones.dlq
app.rabbitmq.tickets-dlq=pedidos360.tickets.dlq

# Claves de enrutamiento hacia las DLQ
app.rabbitmq.notificaciones-dead-routing-key=notificaciones.dead
app.rabbitmq.tickets-dead-routing-key=tickets.dead

# Configuracion para el procesamiento que implementaremos
app.processing.max-attempts=3
app.storage.directory=${OUTPUT_DIRECTORY:./output}